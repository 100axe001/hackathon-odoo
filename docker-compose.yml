services:
  db:
    image: postgres:16-alpine
    container_name: dealflow-db
    environment:
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow
      POSTGRES_DB: dealflow
    ports:
      # 5432 is taken by a system postgresql service. Ours stays on 5433 so the
      # two never collide and nothing on the machine has to be stopped.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
